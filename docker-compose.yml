services:
  mysql-honeypot:
    build:
      context: .
      dockerfile: Dockerfile
    image: mysql-honeypot-rs:latest
    container_name: mysql-honeypot
    restart: unless-stopped

    # Only the MySQL TCP port is published. No admin, HTTP or metrics port.
    ports:
      - "3306:3306"

    # The SQLite log database is the only persistent state.
    volumes:
      - honeypot-data:/data

    # ---- hardening -------------------------------------------------------
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    # A honeypot generates hostile traffic; keep container logs bounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 20s   # lets in-flight sessions flush their log rows

volumes:
  honeypot-data:
