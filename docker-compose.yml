services:
  mysql-honeypot:
    build:
      context: .
      dockerfile: Dockerfile
    image: mysql-honeypot-rs:latest
    container_name: mysql-honeypot
    restart: unless-stopped

    # Only the MySQL TCP port is published. No admin, HTTP or metrics port.
    ports:
      - "3306:3306"

    # The SQLite log database is the only persistent state.
    volumes:
      - honeypot-data:/data

    # ---- hardening -------------------------------------------------------
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # ---- resource limits -------------------------------------------------
    mem_limit: 128m
    # Swap pinned to the memory limit, so the container never pages the host
    # and a saturated honeypot is an OOM kill instead of a slow one.
    memswap_limit: 128m
    # A deliberately positive score: the kernel should reclaim a saturated
    # decoy before it touches any real workload sharing the host.
    oom_score_adj: 500
    # Sessions are async tasks, not threads; the only extra thread is the
    # SQLite writer, so this caps a fork bomb without limiting connections.
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    # A honeypot generates hostile traffic; keep container logs bounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Must stay above shutdown_grace_seconds (10 in deploy/config.docker.toml)
    # so SIGTERM can drain live sessions and flush the log queue before Docker
    # escalates to SIGKILL.
    stop_grace_period: 20s

volumes:
  honeypot-data:
