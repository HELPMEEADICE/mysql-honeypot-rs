# mysql-honeypot-rs configuration
#
# The honeypot opens exactly one TCP listener (the port below). It serves no
# HTTP, WebSocket or admin interface, and it never connects out to anything.

[server]
# Bind address. 0.0.0.0 exposes the trap on every interface.
host = "0.0.0.0"
# The only port this process ever listens on.
port = 3306
# Version string reported in the handshake, VERSION() and @@version.
version = "8.0.36"
# Maximum number of simultaneous sessions; extra clients get ERR 1040.
max_connections = 256
# Idle timeout for a logged-in session, in seconds.
idle_timeout_seconds = 300
# Deadline for a client to finish the handshake, in seconds.
handshake_timeout_seconds = 10
# Largest MySQL payload accepted from a client, in bytes (1 MiB).
max_packet_size = 1048576
# Bytes of each statement stored in SQLite (longer statements are clipped).
max_sql_length = 16384
# Grace period for in-flight sessions when SIGTERM/SIGINT arrives, in seconds.
shutdown_grace_seconds = 5

[authentication]
# Accept every username/password pair. Set to false only for comparison runs,
# in which case every login is refused after the same random delay.
always_accept = true
# Random delay applied to every login, uniform in [min, max], in milliseconds.
delay_min_ms = 2000
delay_max_ms = 6000

[database]
# SQLite file receiving the audit trail.
sqlite_path = "./honeypot.db"
# WAL keeps concurrent readers (your analysis queries) off the writer's back.
enable_wal = true
# Bounded log queue: when the disk cannot keep up, events are dropped and
# counted instead of blocking sessions or growing memory.
queue_capacity = 4096
# How long SQLite waits for a lock before reporting SQLITE_BUSY, in ms.
busy_timeout_ms = 5000

[logging]
# tracing filter: trace | debug | info | warn | error (or a full directive).
level = "info"
# Log one line per statement received (the database always records them all).
log_queries = true

[virtualdb]
# Simulate INSERT / UPDATE / DELETE / CREATE TABLE / DROP TABLE against a
# per-session copy-on-write catalog, so a client that writes and reads back sees
# a consistent (and completely fake) database. Nothing ever touches a real
# database, the filesystem or the network.
#
# Set to false for the absolute minimum footprint: writes are answered with OK
# and no state is kept at all.
enabled = true

# The budgets below bound what one session may accumulate. They are what
# stops a CREATE TABLE / INSERT loop from growing the process without limit.
# Every one of them is enforced *before* anything is mutated, so a statement
# that exceeds a budget leaves the session exactly as it was.
# Maximum tables a session may create (or clone by writing to one), and also
# the maximum number of schemas its overlay may hold.
max_tables = 32
# Maximum rows in one virtual table.
max_rows_per_table = 1000
# Maximum rows across the whole session overlay.
max_total_rows = 2000
# Maximum bytes in one stored string value (an UPDATE is re-checked against it).
max_string_bytes = 1024
# Maximum bytes of overlay storage per session (64 KiB). 256 sessions ×
# 64 KiB bounds the whole overlay at 16 MiB even if every client writes.
# This counts row containers, cell slots, column definitions, schema shells,
# DROP tombstones and SET @var values, not just string payloads.
max_total_bytes = 65536
# Maximum DROP TABLE / DROP DATABASE markers one session may accumulate.
# Only tables that exist in the base catalog need one, so a CREATE/DROP loop
# over new names does not grow this.
max_tombstones = 64
# Maximum columns one CREATE TABLE may define.
max_columns_per_table = 128
